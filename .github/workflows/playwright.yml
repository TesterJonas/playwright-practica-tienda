name: Playwright Tests
on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOCKED_USER: locked_out_user
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

  deploy-report:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      - name: Combine reports
        run: |
          mkdir -p combined-report/playwright
          mkdir -p combined-report/allure
          cp -r./playwright-report/* combined-report/playwright/ || true
          cp -r allure-history/* combined-report/allure/ || true
          echo '<h1>QA Reports</h1><ul><li><a href="./playwright/index.html">Playwright HTML</a></li><li><a href="./allure/index.html">Allure Report</a></li></ul>' > combined-report/index.html
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
