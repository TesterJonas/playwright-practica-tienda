name: Playwright Tests
on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- ESTO ES LO QUE ARREGLA EL TREND ---
      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history to results
        run: |
          if [ -d "allure-history/allure-report/history" ]; then
            mkdir -p allure-results/history
            cp -r allure-history/allure-report/history/* allure-results/history/ || true
            echo "History restored!"
              elif [ -d "allure-history/history" ]; then
              mkdir -p allure-results/history
              cp -r allure-history/history/* allure-results/history/ || true
              echo "History restored (legacy path)!"
              else
                echo "First run, no history - will be created now"
            fi

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOCKED_USER: locked_out_user
        run: npx playwright test

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        if: ${{!cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

  deploy-report:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Combine reports
        run: |
          mkdir -p combined-report/allure
          mkdir -p combined-report/playwright
          cp -r allure-report/* combined-report/allure/
          cp -r playwright-report/* combined-report/playwright/ || true
          cat > combined-report/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>QA Reports</title></head>
          <body style="font-family:sans-serif;text-align:center;margin-top:50px">
          <h1>QA Reports</h1>
          <p><a href="./playwright/index.html" style="font-size:20px">📄 Playwright HTML Report</a></p>
          <p><a href="./allure/index.html" style="font-size:20px">📊 Allure Report (con Trend)</a></p>
          </body></html>
          EOF
          ls -la combined-report/allure/history/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./combined-report
